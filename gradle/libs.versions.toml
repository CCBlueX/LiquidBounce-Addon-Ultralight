# Keep these in sync with the LiquidBounce release you target. A mismatch in `minecraft`,
# `fabric-loom` or `kotlin` is the usual cause of an add-on that compiles but crashes at runtime.
[versions]
jdk = "25"

minecraft = "26.3"
fabric-loom = "1.17-SNAPSHOT"
fabric-loader = "0.19.5"
fabric-api = "0.160.5+26.3"

kotlin = "2.4.20"
fabric-kotlin = "1.14.1+kotlin.2.4.20"

# The add-on compiles against the client itself; there is no separate API artifact.
# Use `<version>+<mc>` for a release or `<version>+<mc>-SNAPSHOT` to track nextgen.
liquidbounce = "0.41.0+26.3"

# Bundled into the add-on: the bindings, whose natives come with the Ultralight runtime
ujr = "0.3.0"
# Bundled as well: decodes the LZMA2 of the Ultralight SDK, Minecraft only ships Commons Compress
xz = "1.10"
# Bundled as well: 7-Zip, for the BCJ2 the Linux and Windows SDKs pack their libraries with
sevenzipjbinding = "16.02-2.01"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }
liquidbounce = { group = "net.ccbluex", name = "liquidbounce", version.ref = "liquidbounce" }
ujr-core = { group = "net.ccbluex.ultralight", name = "ultralight-java-reborn-core", version.ref = "ujr" }
ujr-platform-jni = { group = "net.ccbluex.ultralight", name = "ultralight-java-reborn-platform-jni", version.ref = "ujr" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
sevenzipjbinding = { group = "net.sf.sevenzipjbinding", name = "sevenzipjbinding", version.ref = "sevenzipjbinding" }
sevenzipjbinding-linux = { group = "net.sf.sevenzipjbinding", name = "sevenzipjbinding-linux-amd64", version.ref = "sevenzipjbinding" }
sevenzipjbinding-windows = { group = "net.sf.sevenzipjbinding", name = "sevenzipjbinding-windows-amd64", version.ref = "sevenzipjbinding" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
